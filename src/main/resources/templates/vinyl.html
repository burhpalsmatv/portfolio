<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>vinyl</title>
    <link rel="stylesheet" href="../static/style.css" th:href="@{style.css}">
</head>
<body>

<div id="container">
    <div th:replace="~{fragments/header :: header}">Header</div>

    <div id="flex">
        <main>
            <h1 th:text="${vinyl.albumName}">album name:</h1>
            <div class="vinylContainer">
                <div class="vinylShow">
                <img class="vinylImage" th:src="@{'/img/' + ${vinyl.img}}" alt="vinyl image"/>
                <div>
                    <label>album name:</label>
                    <span th:text="${vinyl.albumName}">album name</span>
                </div>

                <div>
                    <label>artist name:</label>
                    <span th:text="${vinyl.artistName}">artist name</span>
                </div>
                <div>
                    <label>release year of album:</label>
                    <span th:text="${vinyl.releaseYear}">release year</span>
                </div>

                <div>
                    <label>thoughts abt album:</label>
                    <span th:text="${vinyl.story}">my thoughts</span>
                </div>
                <a th:onclick="window.history.go(-1)"><img th:src="@{'/img/goBack.png'}" alt="go back"></a>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
